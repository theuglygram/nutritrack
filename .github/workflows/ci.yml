name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm check

      - run: pnpm --filter @nutritrack/web build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Only the services the schema depends on (auth and storage create their own schemas).
      - run: pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,mailpit,supavisor

      - name: Migrations apply from zero and RLS tests pass
        run: pnpm db:test

      - name: Generated database types are up to date
        run: |
          pnpm db:types
          git diff --exit-code packages/types/src/database.ts
